# Nginx server block for the platform service.
# Install: copy to /etc/nginx/sites-available/app.landcaller.com,
#          ln -s into sites-enabled, nginx -t && systemctl reload nginx.
#
# IMPORTANT: app.landcaller.com DNS stays pointed at the OLD Hostinger host
# until Phase 4 cutover. This block is safe to install early - it only
# receives traffic once DNS moves. Issue the TLS cert AT cutover time
# (certbot --nginx -d app.landcaller.com) since HTTP-01 validation needs DNS
# already pointing here; until then only the port-80 block below is active.

server {
    listen 80;
    server_name app.landcaller.com;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Stripe webhook payloads are small; keep a tight limit.
        client_max_body_size 2m;
    }
}
